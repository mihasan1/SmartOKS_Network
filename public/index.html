<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetPlanner — проектирование локальных сетей</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">🖧 NetPlanner</div>
    <div class="tools">
      <button data-tool="select" class="tool active" title="Выделение / перемещение (V)">✋ Выбор</button>
      <button data-tool="room" class="tool" title="Нарисовать комнату (R)">▭ Комната</button>
      <button data-tool="wall" class="tool" title="Стена / перегородка (W)">／ Стена</button>
      <button data-tool="cable" class="tool" title="Проложить провод (C)">🔌 Провод</button>
      <button data-tool="erase" class="tool" title="Удалить (Del)">🗑 Удалить</button>
    </div>
    <div class="spacer"></div>
    <div class="actions">
      <button id="btn-sim" title="Запустить/остановить симуляцию">▶ Симуляция</button>
      <button id="btn-autoip" title="Раздать IP-адреса по сети">🌐 Авто-IP</button>
      <button id="btn-clear" title="Очистить всё">✖ Очистить</button>
      <span class="sep"></span>
      <input id="proj-name" placeholder="имя проекта" value="моя-сеть" />
      <button id="btn-save">💾 Сохранить</button>
      <select id="proj-list"><option value="">— открыть —</option></select>
    </div>
  </header>

  <div id="main">
    <aside id="palette">
      <h3>Устройства</h3>
      <div class="dev-grid" id="dev-grid"></div>
      <h3>Слои</h3>
      <label class="chk"><input type="checkbox" id="show-rooms" checked /> Помещения</label>
      <label class="chk"><input type="checkbox" id="show-grid" checked /> Сетка</label>
      <label class="chk"><input type="checkbox" id="show-labels" checked /> Подписи / IP</label>
      <h3>Статус</h3>
      <div id="status">Готово</div>
    </aside>

    <div id="canvas-wrap">
      <canvas id="cv"></canvas>
      <div id="hint">Колесо — масштаб · Пробел+тащить или средняя кнопка — панорама</div>
    </div>

    <aside id="inspector">
      <h3>Свойства</h3>
      <div id="insp-body"><p class="muted">Ничего не выбрано</p></div>
      <h3>Консоль</h3>
      <div id="console"></div>
    </aside>
  </div>

  <script src="devices.js"></script>
  <script src="app.js"></script>
</body>
</html>
