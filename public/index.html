<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartOKS — Network Planner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="logo" data-icon="network"></span>
      <span>SmartOKS · Network Planner</span>
    </div>
    <span class="sep"></span>
    <div class="tools">
      <button data-tool="select" class="tool active" data-icon="cursor" data-i18n-title="tool.select.title"><span class="lbl" data-i18n="tool.select">Вибір</span></button>
      <button data-tool="room" class="tool" data-icon="square" data-i18n-title="tool.room.title"><span class="lbl" data-i18n="tool.room">Кімната</span></button>
      <button data-tool="wall" class="tool" data-icon="wall" data-i18n-title="tool.wall.title"><span class="lbl" data-i18n="tool.wall">Стіна</span></button>
      <button data-tool="cable" class="tool" data-icon="cable" data-i18n-title="tool.cable.title"><span class="lbl" data-i18n="tool.cable">Провід</span></button>
      <button data-tool="erase" class="tool" data-icon="trash" data-i18n-title="tool.erase.title"><span class="lbl" data-i18n="tool.erase">Видалити</span></button>
      <span class="sep"></span>
      <button id="btn-undo" class="icon-btn" data-icon="undo" data-i18n-title="act.undo.title" disabled></button>
      <button id="btn-redo" class="icon-btn" data-icon="redo" data-i18n-title="act.redo.title" disabled></button>
    </div>
    <div class="spacer"></div>
    <div class="actions">
      <button id="btn-sim" data-icon="play" data-i18n-title="act.sim.title"><span class="lbl" data-i18n="act.sim">Симуляція</span></button>
      <button id="btn-autoip" data-icon="globe" data-i18n-title="act.autoip.title"><span class="lbl" data-i18n="act.autoip">Авто-IP</span></button>
      <button id="btn-clear" class="icon-btn" data-icon="x" data-i18n-title="act.clear.title"></button>
      <span class="sep"></span>
      <button id="btn-save" data-icon="save" data-i18n-title="act.save"><span class="lbl" data-i18n="act.save">Зберегти</span></button>
      <select id="proj-list"><option value="" data-i18n="proj.open">— відкрити —</option></select>
      <button id="btn-png" class="icon-btn" data-icon="image" data-i18n-title="act.png.title"></button>
      <button id="btn-export" class="icon-btn" data-icon="download" data-i18n-title="act.exportJson.title"></button>
      <button id="btn-import" class="icon-btn" data-icon="upload" data-i18n-title="act.importJson.title"></button>
      <button id="btn-print" class="icon-btn" data-icon="print" data-i18n-title="act.print.title"></button>
      <input type="file" id="file-import" accept="application/json,.json" style="display:none" />
      <span class="sep"></span>
      <button id="theme-toggle" class="icon-btn" title="Тема / Theme"></button>
      <select id="lang-sel" title="Мова / Language">
        <option value="uk">Українська</option>
        <option value="en">English</option>
      </select>
      <div class="user">
        <span class="avatar">SP</span>
        <span class="uname">SmartOKS</span>
      </div>
    </div>
  </header>

  <div id="main">
    <aside id="palette">
      <h3 data-i18n="pal.devices">Пристрої</h3>
      <div class="dev-grid" id="dev-grid"></div>
      <h3 data-i18n="pal.layers">Шари</h3>
      <label class="chk"><input type="checkbox" id="show-rooms" checked /> <span data-i18n="pal.rooms">Приміщення</span></label>
      <label class="chk"><input type="checkbox" id="show-grid" checked /> <span data-i18n="pal.grid">Сітка</span></label>
      <label class="chk"><input type="checkbox" id="show-labels" checked /> <span data-i18n="pal.labels">Підписи / IP</span></label>
      <h3 data-i18n="pal.status">Статус</h3>
      <div id="status">Готово</div>
    </aside>

    <div id="canvas-wrap">
      <canvas id="cv"></canvas>
      <div id="hint" data-i18n="hint">Колесо — масштаб · Пробіл+тягнути або середня кнопка — панорама</div>
    </div>

    <aside id="inspector">
      <h3 data-i18n="insp.props">Властивості</h3>
      <div id="insp-body"><p class="muted" data-i18n="insp.nothing">Нічого не вибрано</p></div>
      <h3 data-i18n="insp.console">Консоль</h3>
      <div id="console"></div>
    </aside>
  </div>

  <script src="i18n.js"></script>
  <script src="icons.js"></script>
  <script src="devices.js"></script>
  <script src="app.js"></script>
</body>
</html>
